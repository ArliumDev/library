<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Library (Remake)</title>
  </head>
  <body>
    <main class="wrapper">
      <dialog class="input-modal">
        <form class="book-form">
          <h4>Create a new entry:</h4>
          <label for="title">Title:</label>
          <input type="text" id="title" required />
          <label for="author">Author:</label>
          <input type="text" id="author" required />
          <label for="pages">Pages:</label>
          <input type="number" id="pages" required />
          <article class="radio-wrapper">
            <input type="radio" id="read" name="readStatus" value="Read" checked required />
            <label for="read">Read</label>
            <input type="radio" id="not-read" name="readStatus" value="Not read" required />
            <label for="not-read">Not read</label>
          </article>
          <article class="buttons-wrapper">
            <button type="button" class="form-cancel">Cancel</button>
            <button type="submit" class="submit">Submit</button>
          </article>
        </form>
      </dialog>
      <section class="book-shelf" ></section>
      <button class="new-entry">+</button>
    </main>
    <script src="script2.js"></script>
  </body>
</html>
